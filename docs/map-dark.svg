<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 994" width="600" height="994" role="img" aria-labelledby="title desc">
<title id="title">The saffml map</title>
<desc id="desc">A flowchart. It starts at a request for a model, which is framed, then a decision: is a model worth it? If not, the rule ships. If so, the work goes through design, data, train, evaluate, launch and monitor, then a decision: is the model still paying? If not, it is retired to the rule; if so, monitoring continues. Dashed arrows loop back: a rejected design and a lost online test return to framing, a model that loses to the rule returns to data, and a live model returns to training when the world moves and to data when an input breaks.</desc>
<defs>
  <marker id="main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/></marker>
  <marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d7d7d"/></marker>
</defs>
