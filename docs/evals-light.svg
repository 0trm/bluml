<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 462" width="816" height="462" role="img" aria-labelledby="title desc">
<title id="title">Does saffml help?</title>
<desc id="desc">Paired bars of the eval scores with saffml and without it, for Sonnet and Opus. Where it helps: rule-first, Sonnet 0.42 without and 0.58 with, Opus 0.33 without and 0.96 with; fraud-threshold, Sonnet 0.56 without and 0.89 with, Opus 0.63 without and 1.00 with; design-doc, Sonnet 0.63 without and 0.93 with, Opus 0.89 without and 1.00 with; ctr-drop, Sonnet 0.88 without and 0.96 with, Opus 0.88 without and 1.00 with. Caught without it: ship-it, Sonnet 0.96 without and 1.00 with, Opus 1.00 without and 1.00 with; churn-leak, Sonnet 1.00 without and 1.00 with, Opus 1.00 without and 1.00 with; ranker-clicks, Sonnet 0.96 without and 0.96 with, Opus 1.00 without and 0.96 with. Mean: Sonnet 0.77 without and 0.90 with, Opus 0.82 without and 0.99 with.</desc>
