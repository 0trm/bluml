<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 462" width="816" height="462" role="img" aria-labelledby="title desc">
<title id="title">Does bluML help?</title>
<desc id="desc">Paired bars of the eval scores with bluML and without it, for Sonnet and Opus. Where it helps: fraud-threshold, Sonnet 0.52 without and 1.00 with, Opus 0.63 without and 0.96 with; rule-first, Sonnet 0.25 without and 0.58 with, Opus 0.50 without and 0.83 with; design-doc, Sonnet 0.59 without and 1.00 with, Opus 0.93 without and 1.00 with; ctr-drop, Sonnet 0.58 without and 0.96 with, Opus 0.88 without and 0.96 with. Caught without it: ship-it, Sonnet 0.88 without and 1.00 with, Opus 0.96 without and 1.00 with; churn-leak, Sonnet 0.92 without and 1.00 with, Opus 1.00 without and 1.00 with; ranker-clicks, Sonnet 0.96 without and 0.92 with, Opus 1.00 without and 1.00 with. Mean: Sonnet 0.67 without and 0.92 with, Opus 0.84 without and 0.96 with.</desc>
